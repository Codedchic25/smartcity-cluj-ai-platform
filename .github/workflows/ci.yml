name: Smart City Core CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-ci:
    name: Lint, seed, and test
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: smart-city-ci.db
      SESSION_SECURITY_TOKEN: ci-only-dummy-session-signing-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: latest

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff
        run: uv run ruff check .

      - name: Seed fresh test database
        run: uv run python seed_db.py

      - name: Run pytest
        run: uv run pytest

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: ai_tests/pytest_report.json
          if-no-files-found: warn
